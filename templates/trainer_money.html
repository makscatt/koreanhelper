{% extends "trainer_base.html" %}
{% block title %}Деньги — {{ student.name }}{% endblock %}
{% block trainer_content %}
<div class="trainer-header">
  <h1 class="trainer-title">💰 Деньги</h1>
</div>

<!-- Level selector -->
<div class="money-levels" id="money-levels">
  <button class="money-level-btn active" data-level="beginner" onclick="setLevel('beginner',this)">🐣 Новичок</button>
  <button class="money-level-btn" data-level="medium" onclick="setLevel('medium',this)">💪 Среднячок</button>
  <button class="money-level-btn" data-level="pro" onclick="setLevel('pro',this)">🔥 Профи</button>
</div>
<div class="money-level-hint" id="level-hint">до 1 000 000₩</div>

<div class="display-container">
  <div class="big-text" id="money-display">0원</div>
  <div class="answer-slot" id="money-text" style="color:var(--primary);font-weight:700;">영</div>
  <div class="controls">
    <button class="action-btn warning" onclick="toggleMoney()" title="Показать чтение">👁️</button>
    <button class="action-btn secondary" onclick="speakMoney()" title="Озвучить">🔊</button>
    <button class="action-btn" onclick="generateMoney()" title="Новое число">🎲</button>
  </div>
</div>

<style>
.money-levels {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.money-level-btn {
  padding: 8px 20px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-main, inherit);
  border: 1.5px solid var(--border-color, #e2e5ec);
  border-radius: 10px;
  background: var(--bg-surface, #fff);
  color: var(--text-secondary, #666);
  cursor: pointer;
  transition: all 0.15s;
}
.money-level-btn:hover {
  border-color: var(--primary, #4758d6);
  color: var(--primary, #4758d6);
}
.money-level-btn.active[data-level="beginner"] {
  background: #ecfdf5; border-color: #22c55e; color: #16a34a;
}
.money-level-btn.active[data-level="medium"] {
  background: #eff4ff; border-color: #2563eb; color: #2563eb;
}
.money-level-btn.active[data-level="pro"] {
  background: #fef3c7; border-color: #f59e0b; color: #d97706;
}
.money-level-hint {
  text-align: center;
  font-size: 12px;
  font-family: var(--font-mono, monospace);
  color: var(--text-tertiary, #999);
  margin-bottom: 16px;
}
</style>
{% endblock %}

{% block trainer_js %}
<script>
document.body.dataset.module = 'money';
let curMoney = 0, lastMoney = -1;
let currentLevel = 'beginner';

const levelHints = {
  beginner: 'до 1 000 000₩',
  medium: '1 000 000 — 100 000 000₩',
  pro: 'любые суммы до 1 000 000 000₩'
};

function setLevel(level, btn) {
  currentLevel = level;
  document.querySelectorAll('.money-level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('level-hint').textContent = levelHints[level];
  generateMoney();
}

function numToKor(n) {
  const d = ['','일','이','삼','사','오','육','칠','팔','구'];
  const u = ['','십','백','천'];
  const b = ['','만','억'];
  if (n === 0) return '영';
  let r = '', bi = 0;
  while (n > 0) {
    let c = n % 10000;
    if (c > 0) {
      let cs = '', ui = 0, t = c;
      while (t > 0) {
        let dg = t % 10;
        if (dg > 0) {
          let ds = (dg === 1 && ui > 0) ? '' : d[dg];
          cs = ds + u[ui] + cs;
        }
        t = Math.floor(t / 10);
        ui++;
      }
      r = cs + b[bi] + r;
    }
    n = Math.floor(n / 10000);
    bi++;
  }
  if (r.startsWith('일만')) r = r.substring(1);
  return r;
}

function generateBeginner() {
  const r = Math.random();
  if (r < 0.15) {
    return (Math.floor(Math.random() * 9) + 1) * 100;
  } else if (r < 0.35) {
    return (Math.floor(Math.random() * 9) + 1) * 1000;
  } else if (r < 0.55) {
    return (Math.floor(Math.random() * 100) + 1) * 500;
  } else if (r < 0.75) {
    return (Math.floor(Math.random() * 99) + 1) * 10000;
  } else {
    const man = Math.floor(Math.random() * 99) + 1;
    const cheon = Math.floor(Math.random() * 9) + 1;
    return man * 10000 + cheon * 1000;
  }
}

function generateMedium() {
  const r = Math.random();
  if (r < 0.3) {
    return (Math.floor(Math.random() * 99) + 1) * 1000000;
  } else if (r < 0.6) {
    const mil = Math.floor(Math.random() * 50) + 1;
    const hundK = (Math.floor(Math.random() * 9) + 1) * 100000;
    return mil * 1000000 + hundK;
  } else {
    const mil = Math.floor(Math.random() * 90) + 1;
    const rest = (Math.floor(Math.random() * 999) + 1) * 1000;
    return mil * 1000000 + rest;
  }
}

function generatePro() {
  const r = Math.random();
  if (r < 0.25) {
    return (Math.floor(Math.random() * 9) + 1) * 100000000 + (Math.floor(Math.random() * 9999) + 1) * 10000;
  } else if (r < 0.5) {
    const base = (Math.floor(Math.random() * 90) + 10) * 1000000;
    const rest = (Math.floor(Math.random() * 9999) + 1) * 100;
    return base + rest;
  } else if (r < 0.75) {
    return Math.floor(Math.random() * 999000) + 1000 + (Math.floor(Math.random() * 9) + 1) * 100;
  } else {
    return (Math.floor(Math.random() * 999999) + 1) * 1000;
  }
}

function generateMoney() {
  trackExercise();
  let a, attempts = 0;
  do {
    if (currentLevel === 'beginner') a = generateBeginner();
    else if (currentLevel === 'medium') a = generateMedium();
    else a = generatePro();
    attempts++;
  } while (a === lastMoney && attempts < 20);

  lastMoney = a;
  curMoney = a;
  document.getElementById('money-display').textContent = a.toLocaleString() + '원';
  const el = document.getElementById('money-text');
  el.textContent = numToKor(a);
  el.style.visibility = 'hidden';
}

function toggleMoney() {
  const el = document.getElementById('money-text');
  el.style.visibility = el.style.visibility === 'hidden' ? 'visible' : 'hidden';
}

function speakMoney() {
  speakText(curMoney + '원');
}

generateMoney();
</script>
{% endblock %}
