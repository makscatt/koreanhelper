{% extends "trainer_base.html" %}
{% block title %}Картинки — {{ student.name }}{% endblock %}

{% block trainer_content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pictures_gallery.css') }}">
<script>document.body.dataset.module = 'pictures';</script>

<div class="trainer-header">
  <button id="back-btn" class="trainer-back" onclick="handleBack()">← Назад</button>
  <span class="trainer-title" id="page-title">Картинки</span>
</div>

<div class="gal-intro">Посмотри на картинку и опиши по-корейски, что видишь и что происходит.</div>

<!-- ═══ GALLERY GRID ═══ -->
<div id="gallery-grid" class="gal-grid"></div>

<!-- ═══ LIGHTBOX VIEWER ═══ -->
<div id="viewer" class="gal-viewer hidden">
  <div class="gal-viewer-backdrop" onclick="closeImage()"></div>
  <div class="gal-viewer-box">
    <button class="gal-viewer-close" onclick="closeImage()" aria-label="Закрыть">✕</button>
    <img id="viewer-img" class="gal-viewer-img" src="" alt="">
    <div id="viewer-title" class="gal-viewer-title"></div>
    <div id="viewer-keywords" class="gal-keywords"></div>
    <div id="viewer-hint" class="gal-hint hidden"></div>
  </div>
</div>
{% endblock %}

{% block trainer_js %}
<script>
  const galleryGrid   = document.getElementById('gallery-grid');
  const viewer        = document.getElementById('viewer');
  const viewerImg     = document.getElementById('viewer-img');
  const viewerTitle   = document.getElementById('viewer-title');
  const viewerKeywords= document.getElementById('viewer-keywords');
  const viewerHint    = document.getElementById('viewer-hint');

  let inViewer = false;

  /* ── BACK ── */
  function handleBack() {
    if (inViewer) closeImage();
    else window.location.href = "{{ url_for('trainer_menu', student_id=student.id) }}";
  }

  /* ── LOAD DATA ── */
  fetch('/static/data/pictures.json')
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(data => renderGallery(data))
    .catch(() => {
      galleryGrid.innerHTML = '<p class="gal-empty" style="color:var(--error)">Ошибка загрузки данных</p>';
    });

  /* ── GALLERY ── */
  function renderGallery(data) {
    galleryGrid.innerHTML = '';
    if (!Array.isArray(data) || data.length === 0) {
      galleryGrid.innerHTML = '<p class="gal-empty">Картинок пока нет</p>';
      return;
    }
    data.forEach(pic => {
      const card = document.createElement('div');
      card.className = 'gal-card';
      card.onclick = () => openImage(pic);
      card.innerHTML = `
        <img src="${pic.image}" alt="${pic.title || ''}" loading="lazy">
        ${pic.title ? `<div class="gal-card-title">${pic.title}</div>` : ''}
      `;
      galleryGrid.appendChild(card);
    });
  }

  /* ── VIEWER ── */
  function openImage(pic) {
    inViewer = true;
    viewerImg.src = pic.image;
    viewerImg.alt = pic.title || '';
    viewerTitle.textContent = pic.title || '';

    // keywords
    viewerKeywords.innerHTML = '';
    if (Array.isArray(pic.keywords) && pic.keywords.length > 0) {
      pic.keywords.forEach(kw => {
        const btn = document.createElement('button');
        btn.className = 'gal-keyword-btn';
        btn.textContent = kw;
        btn.onclick = () => speakText(kw);
        viewerKeywords.appendChild(btn);
      });
    }

    // hint
    if (pic.hint) {
      viewerHint.textContent = '💡 ' + pic.hint;
      viewerHint.classList.remove('hidden');
    } else {
      viewerHint.classList.add('hidden');
    }

    viewer.classList.remove('hidden');
    document.getElementById('page-title').textContent = pic.title || 'Картинки';
    document.getElementById('back-btn').textContent = '← К галерее';
    trackExercise();
  }

  function closeImage() {
    inViewer = false;
    viewer.classList.add('hidden');
    viewerImg.src = '';
    document.getElementById('page-title').textContent = 'Картинки';
    document.getElementById('back-btn').textContent = '← Назад';
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  /* ── ESC closes viewer ── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && inViewer) closeImage();
  });
</script>
{% endblock %}
